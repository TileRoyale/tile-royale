name: Daily PostgreSQL Backup

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC every night
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Create backup via Docker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          DATE=$(date +%Y-%m-%d)
          FILENAME="tile-royale-backup-${DATE}.dump"
          docker run --rm postgres:18 \
            pg_dump "$DATABASE_URL" \
              --format=custom \
              --no-acl \
              --no-owner \
          > "$FILENAME"
          gzip "$FILENAME"
          echo "✅ Backup: ${FILENAME}.gz"
          ls -lh "${FILENAME}.gz"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}-${{ github.run_id }}
          path: tile-royale-backup-*.dump.gz
          retention-days: 90
